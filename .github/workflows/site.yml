# Todos os dias: vai buscar as cotações ao Yahoo, guarda-as no repositório e publica o site no GitHub Pages.
name: Atualizar e publicar
on:
  schedule: [{cron: '30 21 * * *'}]   # 21:30 UTC, depois do fecho de Nova Iorque
  workflow_dispatch:
  push: {branches: [main]}
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  site:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: '${{ steps.d.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Dados
        if: github.event_name != 'push'
        run: |
          node tools/fetch-ohlc.js data
          node tools/quotes-from-ohlc.js data
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add data && (git diff --cached --quiet || (git commit -m "Dados de $(date -u +%F)" && git push))
      - run: node --test test/learn-core.test.js test/globe-core.test.js test/motion3.test.js test/quotes-from-ohlc.test.js
      - name: Site
        run: node build.js data && mkdir -p _site && cp dist/test.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
      - id: d
        uses: actions/deploy-pages@v4
